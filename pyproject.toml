# Проект no-code платформы: ИИ-ядро генерации структуры сайта (Этап 3, A2UI)
[project]
name = "no-code-ai-platform"
version = "0.1.0"
description = "Модуль ai_generator: генерация JSON-структуры сайта через GigaChat (structured output)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "gigachat>=0.2",
    "certifi>=2024.2.2",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.uv]
# Проект — набор плоских модулей, а не устанавливаемый пакет.
# uv ставит только зависимости: нет сборки wheel, нет dist-info,
# нет ошибок "failed to remove directory" на Windows/OneDrive.
package = false